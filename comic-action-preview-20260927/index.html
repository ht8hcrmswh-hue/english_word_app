<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alice 漫画・アクション 最終監査＋星演出</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{max-width:1180px;margin:auto;padding:24px 18px 10px}
h1{margin:0 0 8px;font-size:26px}
p{margin:0;color:#c7c7c7;line-height:1.6}
.grid{max-width:1180px;margin:auto;padding:18px 18px 48px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:#18181d;border:3px solid #ffd21f;border-radius:10px;padding:12px;box-shadow:8px 8px 0 #000}
.card h2{margin:0 0 10px;font-size:18px;color:#ffd21f}
.card img{display:block;width:100%;height:auto;background:#fff;border:2px solid #111}
@media(max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:22px}}
</style>
</head>
<body>
<header>
<h1>Alice 漫画・アクション着せ替え — 7画面＋星獲得演出</h1>
<p>Flutterが430×900で実描画した最新版です。7画面に加え、銀星・金星を獲得した瞬間の漫画・アクション専用演出も確認できます。</p>
</header>
<main class="grid">
<section class="card">
  <h2>01 タイトル</h2>
  <img src="comic_action_title.png" alt="01 タイトル">
</section>

<section class="card">
  <h2>02 LEVEL表面</h2>
  <img src="comic_action_level_front.png" alt="02 LEVEL表面">
</section>

<section class="card">
  <h2>03 LEVEL裏面</h2>
  <img src="comic_action_level_back.png" alt="03 LEVEL裏面">
</section>

<section class="card">
  <h2>04 問題・回答前</h2>
  <img src="comic_action_quiz_unanswered.png" alt="04 問題・回答前">
</section>

<section class="card">
  <h2>05 問題・回答後</h2>
  <img src="comic_action_quiz_answered.png" alt="05 問題・回答後">
</section>

<section class="card">
  <h2>06 結果画面</h2>
  <img src="comic_action_result.png" alt="06 結果画面">
</section>

<section class="card">
  <h2>07 ワールドマップ</h2>
  <img src="comic_action_world_map.png" alt="07 ワールドマップ">
</section>

<section class="card">
  <h2>08 銀星獲得演出</h2>
  <img src="comic_action_reward_silver.png" alt="08 銀星獲得演出">
</section>

<section class="card">
  <h2>09 金星獲得演出</h2>
  <img src="comic_action_reward_gold.png" alt="09 金星獲得演出">
</section></main>
</body>
</html>
