<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alice 派手フォント実機比較</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#f3f3f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:24px 18px 12px;max-width:1040px;margin:auto}
h1{font-size:24px;margin:0 0 8px}
p{color:#bbb;line-height:1.6;margin:0}
.grid{max-width:1040px;margin:auto;padding:16px 18px 40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:#1b1b1d;border:1px solid #333;border-radius:16px;padding:12px}
.card h2{font-size:17px;margin:2px 2px 10px}
.card img{display:block;width:100%;height:auto;border-radius:10px;background:white}
small{display:block;color:#929292;margin:10px 2px 2px;line-height:1.5}
@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:21px}}
</style>
</head>
<body>
<header>
<h1>Alice 派手フォント実機比較</h1>
<p>Flutterが実際のAlice問題画面を430×900で描画した比較です。Webフォントの代替表示ではなく、アプリに同梱した実フォントを使用しています。</p>
</header>
<main class="grid">
<section class="card"><h2>1. 漫画・アクション</h2><img src="font_action.png" alt="漫画・アクション"><small>Rampart One + Reggae One</small></section>
<section class="card"><h2>2. レトロゲーム</h2><img src="font_retro.png" alt="レトロゲーム"><small>DotGothic16</small></section>
<section class="card"><h2>3. かわいい・絵本</h2><img src="font_cute.png" alt="かわいい・絵本"><small>Hachi Maru Pop</small></section>
<section class="card"><h2>4. 和風・怪異</h2><img src="font_yokai.png" alt="和風・怪異"><small>Yuji Syuku</small></section>
</main>
</body>
</html>
