name: Alice one-shot deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/alice-one-shot-deploy.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public Pages repository
        uses: actions/checkout@v6

      # CI 35531488929 tested merge 266f653b807db54e36da8641567e7139978522bc.
      # Source e4d8e211c196cb4c3baea5bf43507566c8498e62 has the identical tree:
      # 1950d99c53e965f0c5cb9dcc5d1bbce08a1bc0b1. Reuse that tested artifact.
      - name: Download verified Alice web build
        env:
          ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-6ac4-8206-9f88-b5c7d3038dc9/raw?se=2026-09-20T19%3A21%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=9198c8f2-ca58-57e5-8523-509966653727&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T06%3A57%3A37Z&ske=2026-09-21T06%3A57%3A37Z&sks=b&skv=2026-02-06&sig=Xhat/ExQme2p6gtJv/cVj5e9oXN/QktkCTEk/A7QCQA%3D"
        run: |
          curl --fail --location --max-time 90 "$ARTIFACT_URL" --output /tmp/alice-web-build.zip
          echo '26c62a6a4f0b64cccf45727fb0b8f46b46ea91d0dc14fa55c0bd0420fcfccf42  /tmp/alice-web-build.zip' | sha256sum --check
          mkdir -p /tmp/alice-web-build
          unzip -q /tmp/alice-web-build.zip -d /tmp/alice-web-build

      - name: Copy build and add cache busting
        run: |
          echo '55d3eaeb12aaafa4df09c8cc221d89f935f849e38541fd12f608352b8d99fdaf  main.dart.js' | sha256sum --check
          cp /tmp/alice-web-build/index.html /tmp/alice-web-build/flutter_bootstrap.js /tmp/alice-web-build/main.dart.js .
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          version = 'e4d8e211'
          assert hashlib.sha256(Path('main.dart.js').read_bytes()).hexdigest() == '2cc4ab43ebc7a93f4d580c704195afa5f691fade74d1fefafaba3b94bebdebcf'
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = 'src="flutter_bootstrap.js"'
          assert text.count(old) == 1, 'Unexpected bootstrap reference'
          index.write_text(text.replace(old, f'src="flutter_bootstrap.js?v={version}"'), encoding='utf-8')
          bootstrap = Path('flutter_bootstrap.js')
          text = bootstrap.read_text(encoding='utf-8')
          old = '"mainJsPath":"main.dart.js"'
          assert text.count(old) == 1, 'Unexpected main script reference'
          bootstrap.write_text(text.replace(old, f'"mainJsPath":"main.dart.js?v={version}"'), encoding='utf-8')
          expected = {
              'index.html': 'cf231b0b7b245d48e2e72839828d36f0687f3ab58d5bbda66b6a3f4ab5ce0207',
              'flutter_bootstrap.js': '7467fc52900100468d9faba9c1d88193804787fcb4cf8363a67de332ad8cf0b5',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY

      - name: Publish build
        run: |
          git config user.name 'alice-deploy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html flutter_bootstrap.js main.dart.js
          git commit -m 'Deploy direct study transitions from source e4d8e211c196cb4c3baea5bf43507566c8498e62'
          git push origin main

      - name: Verify files served by GitHub Pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import time
          import urllib.request
          base = 'https://ht8hcrmswh-hue.github.io/english_word_app/'
          names = ('index.html', 'flutter_bootstrap.js', 'main.dart.js')
          expected = {n: hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names}
          probes = ('',) + names
          for attempt in range(36):
              try:
                  for name in probes:
                      req = urllib.request.Request(base + name + '?v=e4d8e211', headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          actual = hashlib.sha256(response.read()).hexdigest()
                      if actual != expected[name or 'index.html']:
                          raise ValueError((name or 'root page') + ' has not been updated yet')
                  for name in probes:
                      print('PAGES VERIFIED', name or 'root page', expected[name or 'index.html'])
                  print('SOURCE TREE VERIFIED 1950d99c53e965f0c5cb9dcc5d1bbce08a1bc0b1')
                  print('MERGED SOURCE e4d8e211c196cb4c3baea5bf43507566c8498e62')
                  break
              except Exception as error:
                  if attempt == 35:
                      raise
                  print('Waiting for Pages:', str(error), flush=True)
                  time.sleep(5)
          PY
