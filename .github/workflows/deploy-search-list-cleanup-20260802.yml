name: Deploy simplified search list

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-search-list-cleanup-20260802.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-6eb8-8211-a12f-88b46af15c0c/raw?se=2026-08-02T04:20:29Z&sp=r&sv=2026-02-06&sr=b&scid=a8c91dd7-660a-50e6-9c35-fe7095c603bf&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T00:14:09Z&ske=2026-08-03T00:14:09Z&sks=b&skv=2026-02-06&sig=NajP3bH7sKK8MHXktd73MgwnIx4q64dx/Nped0vSblI%3D'
    steps:
      - name: Check out Pages repository
        uses: actions/checkout@v6

      - name: Download verified Web build
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/alice-web-build.zip
          mkdir -p /tmp/alice-web-build
          unzip -q /tmp/alice-web-build.zip -d /tmp/alice-web-build

      - name: Replace published files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/alice-web-build/. .
          touch .nojekyll

      - name: Commit deployment and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deploy-search-list-cleanup-20260802.yml
          git add -A
          git commit -m "Deploy simplified search results"
          git push origin HEAD:main
