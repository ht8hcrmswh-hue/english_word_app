name: Deploy all meanings vocabulary build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-all-meanings-20260802.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-7abc-820b-b4b5-5582934961ef/raw?se=2026-08-02T00:45:11Z&sp=r&sv=2026-02-06&sr=b&scid=b3059d37-00ea-51f1-94bb-1facb01a66a7&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-02T00:23:28Z&ske=2026-08-03T00:23:28Z&sks=b&skv=2026-02-06&sig=mAwQ1ADw0rNlUIW42hTxYL%2BcR4FPWYBnflfIE9rd31c%3D'
    steps:
      - name: Check out Pages repository
        uses: actions/checkout@v6

      - name: Download verified Web build
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/alice-web-build.zip
          mkdir -p /tmp/alice-web-build
          unzip -q /tmp/alice-web-build.zip -d /tmp/alice-web-build

      - name: Replace published files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/alice-web-build/. .
          touch .nojekyll

      - name: Commit deployment and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deploy-all-meanings-20260802.yml
          git add -A
          git commit -m "Deploy 236 reviewed meanings and detail views"
          git push origin HEAD:main
