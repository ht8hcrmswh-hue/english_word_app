name: Deploy reviewed vocabulary build once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public Pages repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download verified Alice Web build
        env:
          BUILD_ZIP_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-1500-820b-992c-f893bd4b0d39/raw?se=2026-08-02T00:03:40Z&sp=r&sv=2026-02-06&sr=b&scid=33b1b0a4-f1c5-5e31-a7f4-a57f89093ef0&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T23:26:45Z&ske=2026-08-02T23:26:45Z&sks=b&skv=2026-02-06&sig=kmmnYD/xQtYMxS5j6Utq27l2R1V5dCVfCLuOKSC1LhY%3D"
        run: |
          curl --fail --location "$BUILD_ZIP_URL" --output /tmp/alice-web-build.zip
          mkdir -p /tmp/alice-web-build
          unzip -q /tmp/alice-web-build.zip -d /tmp/alice-web-build

      - name: Replace Pages build
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/alice-web-build/. .
          touch .nojekyll
          rm -f .github/workflows/deploy-reviewed-vocabulary-once.yml

      - name: Commit deployed build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Deploy 361 reviewed vocabulary terms"
          git push origin HEAD:main
