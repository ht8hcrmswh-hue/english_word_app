name: Finalize Alice Pages publish bridge

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-alice-publish-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Pages repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reassemble and verify Alice build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zipfile

          manifest = json.loads(Path('publish_bridge/manifest.json').read_text(encoding='utf-8'))
          chunks = sorted(Path('publish_bridge/chunks').glob('part_*.b64'))
          expected_count = manifest['chunk_count']
          if len(chunks) != expected_count:
              raise SystemExit(f"chunk count mismatch: {len(chunks)} != {expected_count}")

          expected_names = [f'part_{i:04d}.b64' for i in range(expected_count)]
          actual_names = [p.name for p in chunks]
          if actual_names != expected_names:
              raise SystemExit('chunk sequence mismatch')

          encoded = ''.join(p.read_text(encoding='ascii') for p in chunks)
          raw = base64.b64decode(encoded, validate=True)
          if len(raw) != manifest['archive_bytes']:
              raise SystemExit('archive size mismatch')
          digest = hashlib.sha256(raw).hexdigest()
          if digest != manifest['archive_sha256']:
              raise SystemExit('archive SHA256 mismatch')

          archive = Path('/tmp/alice-pages-overlay.zip')
          archive.write_bytes(raw)
          with zipfile.ZipFile(archive) as z:
              names = sorted(n for n in z.namelist() if not n.endswith('/'))
              if names != sorted(manifest['changed_files']):
                  raise SystemExit('overlay member list mismatch')
              z.extractall('.')

          version = manifest['source_commit'][:8]
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = 'src="flutter_bootstrap.js"'
          if text.count(old) != 1:
              raise SystemExit('unexpected bootstrap reference in index.html')
          index.write_text(text.replace(old, f'src="flutter_bootstrap.js?v={version}"'), encoding='utf-8')

          bootstrap = Path('flutter_bootstrap.js')
          text = bootstrap.read_text(encoding='utf-8')
          old = '"mainJsPath":"main.dart.js"'
          if text.count(old) != 1:
              raise SystemExit('unexpected main.dart.js reference')
          bootstrap.write_text(
              text.replace(old, f'"mainJsPath":"main.dart.js?v={version}"'),
              encoding='utf-8',
          )

          Path('/tmp/alice-version.txt').write_text(version, encoding='ascii')
          print('VERIFIED_SOURCE', manifest['source_commit'])
          print('VERIFIED_ARCHIVE_SHA256', digest)
          print('CHANGED_FILES', len(manifest['changed_files']))
          PY

      - name: Publish final Alice build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish_bridge
          rm -f .github/workflows/finalize-alice-publish-bridge.yml
          git config user.name 'alice-deploy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish final manga action Alice build'
          git push origin main

      - name: Verify GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, time, urllib.request

          base = 'https://ht8hcrmswh-hue.github.io/english_word_app/'
          version = Path('/tmp/alice-version.txt').read_text(encoding='ascii')
          names = ('index.html', 'flutter_bootstrap.js', 'main.dart.js')
          expected = {n: hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names}

          for attempt in range(48):
              try:
                  for name in names:
                      req = urllib.request.Request(
                          base + name + '?v=' + version,
                          headers={'Cache-Control': 'no-cache'},
                      )
                      with urllib.request.urlopen(req, timeout=20) as response:
                          actual = hashlib.sha256(response.read()).hexdigest()
                      if actual != expected[name]:
                          raise ValueError(name + ' has not updated yet')
                  print('PAGES VERIFIED', version)
                  break
              except Exception as error:
                  if attempt == 47:
                      raise
                  print('Waiting for Pages:', error, flush=True)
                  time.sleep(5)
          PY
