name: Deploy Nemea build once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public Pages repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download verified Alice Web build
        env:
          BUILD_ZIP_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-ae3c-820b-9678-7a0aaca7b76a/raw?se=2026-08-01T23:03:37Z&sp=r&sv=2026-02-06&sr=b&scid=e7d45238-006b-5b46-b7eb-5ad5c33b640d&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T22:04:51Z&ske=2026-08-02T22:04:51Z&sks=b&skv=2026-02-06&sig=XLnrgiGhkeCo/a/dO3Bttibj42CpRTHIsgGbEVC7HQA%3D"
        run: |
          curl --fail --location "$BUILD_ZIP_URL" --output /tmp/alice-web-build.zip
          mkdir -p /tmp/alice-web-build
          unzip -q /tmp/alice-web-build.zip -d /tmp/alice-web-build

      - name: Replace Pages build
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/alice-web-build/. .
          touch .nojekyll
          rm -f .github/workflows/deploy-nemea-build-once.yml

      - name: Commit deployed build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Deploy Nemea vocabulary master migration"
          git push origin HEAD:main
