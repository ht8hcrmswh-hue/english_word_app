name: Deploy title skin authoring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-title-skin-authoring.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download verified build
        env:
          ARTIFACT_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-9460-8230-a61e-c96d8bfe3810/raw?se=2026-09-21T07%3A30%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=bd91548d-8a25-566f-afbf-73a1d94817ce&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T23%3A28%3A03Z&ske=2026-09-21T23%3A28%3A03Z&sks=b&skv=2026-02-06&sig=A838Qttpl1tn6mP15sECt3yoyZL7f5mX8yAwschc8sE%3D"
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/alice.zip
          rm -rf /tmp/alice-build
          mkdir -p /tmp/alice-build
          unzip -q /tmp/alice.zip -d /tmp/alice-build
      - name: Replace Pages build and cache bust
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/alice-build/. .
          python3 - <<'PY'
          from pathlib import Path
          version = "c837d254"
          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace('src="flutter_bootstrap.js"', f'src="flutter_bootstrap.js?v={version}"')
          index.write_text(text, encoding="utf-8")
          bootstrap = Path("flutter_bootstrap.js")
          text = bootstrap.read_text(encoding="utf-8")
          text = text.replace('"mainJsPath":"main.dart.js"', f'"mainJsPath":"main.dart.js?v={version}"')
          bootstrap.write_text(text, encoding="utf-8")
          PY
      - name: Publish
        run: |
          git config user.name "alice-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy title skin authoring c837d254" || exit 0
          git push origin main
