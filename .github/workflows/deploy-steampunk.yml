name: Deploy Quiz Panel Spacing

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-steampunk.yml']

permissions:
  contents: write

concurrency:
  group: alice-pages-deploy
  cancel-in-progress: false

# SOURCE_SHA passed CI and code audit. User approved device-first visual review.
# EXPECTED_PUBLIC_MAIN_SHA is the public main snapshot BEFORE committing this
# workflow update. The trigger commit must be its direct child and may change
# only this workflow. Neither branch protection nor divergent main is bypassed.
env:
  ARTIFACT_URL: 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-8b40-820c-a05b-87ec2f1d025f/raw?se=2026-09-23T11%3A41%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=632afa4c-6ffd-439c-a3ba-df7b89dbf05a&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T07%3A54%3A29Z&ske=2026-09-24T07%3A54%3A29Z&sks=b&skv=2026-02-06&sig=020BY901tsqcdgFsfQtJocNa30vPnCLgHsJ5%2BRWtTVs%3D'
  ZIP_SHA256: 'eac7132b4286dc777c7162977338c531b1a1ac049ab3f12e5d677cf93a4538ad'
  SOURCE_SHA: 'a70261731d598d01819a9efd1208eb2ced5d7b3b'
  EXPECTED_PUBLIC_MAIN_SHA: '2061afde1ecb66bf2f20e72b4d68e28d78ce75c7'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Validate release inputs and public main snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from urllib.parse import urlsplit

          for key in ('SOURCE_SHA', 'EXPECTED_PUBLIC_MAIN_SHA'):
              if not re.fullmatch(r'[0-9a-f]{40}', os.environ[key]):
                  raise SystemExit(f'Missing or invalid {key}; deployment is disabled.')
          for key in ('ZIP_SHA256',):
              if not re.fullmatch(r'[0-9a-f]{64}', os.environ[key]):
                  raise SystemExit(f'Missing or invalid {key}; deployment is disabled.')
          url = urlsplit(os.environ['ARTIFACT_URL'])
          if url.scheme != 'https' or not url.hostname or url.username or url.password:
              raise SystemExit('ARTIFACT_URL must be an HTTPS artifact URL.')

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          trigger = os.environ['GITHUB_SHA']
          expected = os.environ['EXPECTED_PUBLIC_MAIN_SHA']
          if git('rev-parse', 'HEAD') != trigger:
              raise SystemExit('Checkout is not the triggering commit.')
          parents = git('show', '-s', '--format=%P', 'HEAD').split()
          if parents != [expected]:
              raise SystemExit('Unexpected public main parent; re-inspect before deployment.')
          changed = git('diff', '--name-only', expected, trigger).splitlines()
          if changed != ['.github/workflows/deploy-steampunk.yml']:
              raise SystemExit(f'Trigger contains unexpected changes: {changed}')
          remote = git('ls-remote', 'origin', 'refs/heads/main').split()
          if not remote or remote[0] != trigger:
              raise SystemExit('Public main advanced; deployment stopped without rewriting it.')
          PY

      - name: Download and safely extract verified Alice build
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$(mktemp -d "$RUNNER_TEMP/alice-release.XXXXXX")"
          export ALICE_RELEASE_DIR="$release_dir"
          printf 'ALICE_RELEASE_DIR=%s\n' "$release_dir" >> "$GITHUB_ENV"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-time 120 --max-filesize 536870912 \
            "$ARTIFACT_URL" -o "$release_dir/build.zip"
          printf '%s  %s\n' "$ZIP_SHA256" "$release_dir/build.zip" | sha256sum --check
          python3 - <<'PY'
          import json
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          release = Path(os.environ['ALICE_RELEASE_DIR'])
          root = release / 'web'
          root.mkdir()
          allowed_files = {
              'favicon.png', 'flutter.js', 'flutter_bootstrap.js',
              'flutter_service_worker.js', 'index.html', 'main.dart.js',
              'manifest.json', 'version.json', '.nojekyll',
          }
          allowed_directories = {'assets', 'canvaskit', 'icons'}
          required_files = allowed_files - {'.nojekyll'}
          paths = []
          seen = set()
          with zipfile.ZipFile(release / 'build.zip') as archive:
              entries = archive.infolist()
              if len(entries) > 10000 or sum(i.file_size for i in entries) > 536870912:
                  raise SystemExit('Archive exceeds release size limits.')
              for entry in entries:
                  name = entry.filename
                  path = PurePosixPath(name)
                  if (not name or '\\' in name or ':' in name or '\x00' in name
                          or path.is_absolute() or '..' in path.parts
                          or path.as_posix() != name.rstrip('/')):
                      raise SystemExit(f'Unsafe archive path: {name!r}')
                  folded = name.rstrip('/').casefold()
                  if folded in seen:
                      raise SystemExit(f'Duplicate archive path: {name!r}')
                  seen.add(folded)
                  if any(part in {'.git', '.github'} for part in path.parts):
                      raise SystemExit('Archive contains repository administration paths.')
                  if path.parts[0] not in allowed_directories:
                      if len(path.parts) != 1 or name not in allowed_files or entry.is_dir():
                          raise SystemExit(f'Unexpected build path: {name!r}')
                  kind = stat.S_IFMT(entry.external_attr >> 16)
                  if kind not in {0, stat.S_IFREG, stat.S_IFDIR}:
                      raise SystemExit(f'Non-regular archive entry: {name!r}')
                  if entry.flag_bits & 1:
                      raise SystemExit('Encrypted build entries are not permitted.')
                  if not entry.is_dir():
                      paths.append(name)
              if not required_files.issubset(paths):
                  raise SystemExit(f'Missing build files: {required_files - set(paths)}')
              # Validate every path before extracting any entry; no extractall.
              for entry in entries:
                  destination = root.joinpath(*PurePosixPath(entry.filename).parts)
                  if entry.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(entry) as source, destination.open('xb') as target:
                          shutil.copyfileobj(source, target)
          (release / 'build-paths.json').write_text(json.dumps(sorted(paths)), encoding='utf-8')
          PY

      - name: Verify build and retained theme archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          web = Path(os.environ['ALICE_RELEASE_DIR']) / 'web'
          # The entire archive was pinned to the successful CI artifact digest.
          # Record JS identity before the narrowly scoped cache-busting edits.
          js_digest = hashlib.sha256((web / 'main.dart.js').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'JS_SHA256={js_digest}\n')
          index = (web / 'index.html').read_text(encoding='utf-8')
          assert index.count('<base href="/english_word_app/">') == 1, 'Wrong Pages base href'
          assert json.loads((web / 'manifest.json').read_text(encoding='utf-8'))['start_url'] == '.', 'Changed app start URL'

          palace = web / 'assets/assets/images/deep_sea_palace_title.webp'
          assert palace.stat().st_size == 341996, 'Unexpected palace artwork size'
          assert hashlib.sha256(palace.read_bytes()).hexdigest() == 'cefe0edd3c81bb5dc2af0f62eb179f9ce254455e0d5e04874fcb2979e9ebd80a', 'Palace artwork differs from approved asset'

          clean = web / 'assets/assets/images/deep_sea_palace_title_clean.webp'
          assert clean.stat().st_size == 294636, 'Unexpected clean palace artwork size'
          assert hashlib.sha256(clean.read_bytes()).hexdigest() == 'e58b14d2db12e43ef5a1409575eec03a7a0c091aae4ce847427dc01ba71145d5', 'Clean palace artwork differs from reviewed asset'

          for name, size, digest in (
              ('sky_temple_title.webp', 271324, 'bcd975c206c79ac1a13627b7a9bf23f7aa18e39e3cf9efcdbd9609cd8ff4625e'),
              ('sky_temple_common.webp', 174752, 'feb7f8ec1dc74247d3a733cb2d1d97c313c2b9c30446f4010e24ee33576fe3f2'),
          ):
              asset = web / 'assets/assets/images' / name
              assert asset.stat().st_size == size, name
              assert hashlib.sha256(asset.read_bytes()).hexdigest() == digest, name

          root = web / 'assets/assets/images/themes/steampunk'
          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['id'] == 'steampunk'
          assert manifest['displayName'] == 'スチームパンク'
          assert manifest['themeVersion'] == 1
          # Preserve the approved schema-1 archive. Only the title is used by
          # the UI-first skin; the other six images are retained, not recreated.
          expected = {
              'title': ('title.webp', 48836, '05fff182c62be55d1441139b7624e7f12433f6702159dfdf0faccea747aac9a9'),
              'levelFront': ('level_front.webp', 37462, '5db8257c3e52cb444ee5b1b18fdacc5725211cfc582da978f6f6b6c2969b1604'),
              'levelBack': ('level_back.webp', 41050, '2fa33b873082fdd0a2ef142495f20fe1dfdc6708d1de8da969c6f30dcb88d6cc'),
              'quizUnanswered': ('quiz_unanswered.webp', 43230, '6eaf42f2aa97f7ac0f11278219f4e100e4814bdc79363c63464f984fba8ec2de'),
              'quizAnswered': ('quiz_answered.webp', 40668, '338a53c271f16aa0acef224842940f7cb800e86f7e50844cf2a3a3b3843e209a'),
              'result': ('result.webp', 56252, '0a23225b6c7ec6c8ddc2d182e9f756adb48b65f7c7843dd2fc7b4125ac5168a9'),
              'worldMap': ('world_map.webp', 63348, '77fd9dedaa15a636dcbd7702b59bdfdc3ff02b06d22f8a3ff39fb20e63243620'),
          }
          for key, (name, size, digest) in expected.items():
              record = manifest['assets'][key]
              assert record['file'] == name, (key, record)
              path = root / name
              assert path.stat().st_size == size, (name, path.stat().st_size)
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest() == '428b1fb1f04f010e117540eadda5171362b20cfc0e857a728a323b44156be2a4'
          PY

      - name: Add cache busting and overlay build files without deletions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path, PurePosixPath

          release = Path(os.environ['ALICE_RELEASE_DIR'])
          web = release / 'web'
          version = os.environ['SOURCE_SHA']
          replacements = {
              'index.html': ('src="flutter_bootstrap.js"', f'src="flutter_bootstrap.js?v={version}"'),
              'flutter_bootstrap.js': ('"mainJsPath":"main.dart.js"', f'"mainJsPath":"main.dart.js?v={version}"'),
          }
          for name, (old, new) in replacements.items():
              path = web / name
              content = path.read_text(encoding='utf-8')
              assert content.count(old) == 1, f'Unexpected script reference: {name}'
              path.write_text(content.replace(old, new), encoding='utf-8')
          # All original bytes came from the SHA256-verified CI archive.
          # Only the two exact script references above may be rewritten.
          assert hashlib.sha256((web / 'main.dart.js').read_bytes()).hexdigest() == os.environ['JS_SHA256']

          paths = json.loads((release / 'build-paths.json').read_text(encoding='utf-8'))
          checkout = Path.cwd()
          for name in paths:
              parts = PurePosixPath(name).parts
              destination = checkout
              for part in parts:
                  destination = destination / part
                  if destination.is_symlink():
                      raise SystemExit(f'Refusing existing symlink: {name}')
              if destination.exists() and not destination.is_file():
                  raise SystemExit(f'Refusing to replace non-file: {name}')
          for name in paths:
              destination = checkout / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(web / name, destination)
          (release / 'stage-paths.nul').write_bytes(b'\x00'.join(name.encode('utf-8') for name in paths) + b'\x00')
          # No file is deleted; .github, .git and unrelated paths are preserved.
          PY

      - name: Publish only verified build paths
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$GITHUB_SHA" || { echo 'Public main advanced; stopping.'; exit 1; }
          GIT_LITERAL_PATHSPECS=1 git add --pathspec-from-file="$ALICE_RELEASE_DIR/stage-paths.nul" --pathspec-file-nul
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          expected = set(json.loads((Path(os.environ['ALICE_RELEASE_DIR']) / 'build-paths.json').read_text(encoding='utf-8')))
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode('utf-8').split('\x00')
          assert set(filter(None, staged)).issubset(expected), 'Unrelated staged change'
          deleted = subprocess.check_output(['git', 'diff', '--cached', '--diff-filter=D', '--name-only'])
          assert not deleted, 'Deletions are not part of this release'
          PY
          if ! git diff --cached --quiet; then
            git config user.name "alice-deploy-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Deploy quiz panel spacing from source $SOURCE_SHA"
            git push origin HEAD:main
          fi
          printf 'Published repository commit: %s\nSource commit: %s\n' "$(git rev-parse HEAD)" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify files served by GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import time
          import urllib.request
          from pathlib import Path

          base = 'https://ht8hcrmswh-hue.github.io/english_word_app/'
          version = os.environ['SOURCE_SHA']
          names = [
              '', 'index.html', 'flutter_bootstrap.js', 'main.dart.js',
              'flutter_service_worker.js', 'manifest.json', 'version.json',
              'assets/assets/images/deep_sea_palace_title.webp',
              'assets/assets/images/deep_sea_palace_title_clean.webp',
              'assets/assets/images/sky_temple_title.webp',
              'assets/assets/images/sky_temple_common.webp',
              'assets/assets/images/themes/steampunk/manifest.json',
              *[f'assets/assets/images/themes/steampunk/{name}.webp' for name in (
                  'title', 'level_front', 'level_back', 'quiz_unanswered',
                  'quiz_answered', 'result', 'world_map',
              )],
          ]
          expected = {name: hashlib.sha256(Path(name or 'index.html').read_bytes()).hexdigest() for name in names}
          deadline = time.monotonic() + 180
          while True:
              try:
                  for name, digest in expected.items():
                      request = urllib.request.Request(
                          base + name + f'?v={version}',
                          headers={'Cache-Control': 'no-cache'},
                      )
                      with urllib.request.urlopen(request, timeout=15) as response:
                          actual = hashlib.sha256(response.read()).hexdigest()
                      if actual != digest:
                          raise ValueError((name or 'root page') + ' differs from the verified build')
                  print('PAGES FILES VERIFIED', version)
                  for name, digest in expected.items():
                      print(name or 'root page', digest)
                  break
              except Exception as error:
                  if time.monotonic() >= deadline:
                      raise
                  print('Waiting for Pages:', str(error), flush=True)
                  time.sleep(5)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Public entrypoints and retained theme files match the verified build.\n')
              summary.write('Confirm the Pages deployment job and real-device operation separately.\n')
          PY
