name: Deploy Steampunk Alice

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-steampunk.yml']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - name: Download verified Alice build
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-8590-820b-bc0a-f99ce1f2ce63/raw?se=2026-09-21T12%3A26%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=5363d98a-b194-5185-94f5-fffc122020fb&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T22%3A52%3A52Z&ske=2026-09-21T22%3A52%3A52Z&sks=b&skv=2026-02-06&sig=EaRdAX/PZNf0WS3J248M7CqiQqpYfi0iHOW9vntCtt8%3D"
        run: |
          set -euo pipefail
          curl --fail --location --max-time 120 "$ARTIFACT_URL" -o /tmp/alice-web-build.zip
          echo '3c14cb9d04367190140c626fa000b223cf1a89f6dd07c1299056701e99bd2d87  /tmp/alice-web-build.zip' | sha256sum --check
          rm -rf /tmp/alice-build
          mkdir -p /tmp/alice-build
          unzip -q /tmp/alice-web-build.zip -d /tmp/alice-build

      - name: Verify source build
        run: |
          set -euo pipefail
          echo '8b11ec36ddee15daf5e2702b0d539f45d1ae4b1abf5c993808c10f110ae508f9  /tmp/alice-build/main.dart.js' | sha256sum --check
          for name in             steampunk_title             steampunk_level_front             steampunk_level_back             steampunk_quiz_unanswered             steampunk_quiz_answered             steampunk_result             steampunk_world_map
          do
            test -s "/tmp/alice-build/assets/assets/images/${name}.webp"
            file "/tmp/alice-build/assets/assets/images/${name}.webp" | grep -qi 'Web/P image'
          done

      - name: Replace Pages build and add cache busting
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/alice-build/. .
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          version = 'ac0b2ed6'
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = 'src="flutter_bootstrap.js"'
          assert text.count(old) == 1, 'Unexpected bootstrap reference'
          index.write_text(text.replace(old, f'src="flutter_bootstrap.js?v={version}"'), encoding='utf-8')
          bootstrap = Path('flutter_bootstrap.js')
          text = bootstrap.read_text(encoding='utf-8')
          old = '"mainJsPath":"main.dart.js"'
          assert text.count(old) == 1, 'Unexpected main script reference'
          bootstrap.write_text(text.replace(old, f'"mainJsPath":"main.dart.js?v={version}"'), encoding='utf-8')
          expected = {
              'index.html': '2dc11e166b5891593b313b9f27b4bc5a2bb4a3aaf1a61a8e13b830893da6571d',
              'flutter_bootstrap.js': 'b84067e0bc8820e3b4bc524c2847d87641966a5d9226e4f341486884d530449d',
              'main.dart.js': '8b11ec36ddee15daf5e2702b0d539f45d1ae4b1abf5c993808c10f110ae508f9',
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual)
          PY

      - name: Publish build
        run: |
          set -euo pipefail
          git config user.name "alice-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Steampunk Alice ac0b2ed6"
          git push origin main

      - name: Verify files served by GitHub Pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import time
          import urllib.request

          base = 'https://ht8hcrmswh-hue.github.io/english_word_app/'
          version = 'ac0b2ed6'
          names = ('index.html', 'flutter_bootstrap.js', 'main.dart.js')
          expected = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names}
          probes = ('',) + names
          for attempt in range(36):
              try:
                  for name in probes:
                      req = urllib.request.Request(
                          base + name + f'?v={version}',
                          headers={'Cache-Control': 'no-cache'},
                      )
                      with urllib.request.urlopen(req, timeout=20) as response:
                          actual = hashlib.sha256(response.read()).hexdigest()
                      if actual != expected[name or 'index.html']:
                          raise ValueError((name or 'root page') + ' has not been updated yet')
                  print('PAGES VERIFIED', version)
                  for name in names:
                      print(name, expected[name])
                  break
              except Exception as error:
                  if attempt == 35:
                      raise
                  print('Waiting for Pages:', str(error), flush=True)
                  time.sleep(5)
          PY
