name: Deploy reviewed 8-to-10 vocabulary build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-reviewed-8to10-20260802.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-8a70-8207-94d1-eb7241b8216a/raw?se=2026-08-02T03:44:19Z&sp=r&sv=2026-02-06&sr=b&scid=f72ec66d-a744-5d3c-9198-746a1c9b22e0&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T23:27:10Z&ske=2026-08-02T23:27:10Z&sks=b&skv=2026-02-06&sig=/YaNB8y3JmRiralYBFDfv%2B5KZuanb9ReKU%2BPLm87js4%3D'
    steps:
      - name: Check out Pages repository
        uses: actions/checkout@v6

      - name: Download verified Web build
        run: |
          curl --fail --location "$ARTIFACT_URL" --output /tmp/alice-web-build.zip
          mkdir -p /tmp/alice-web-build
          unzip -q /tmp/alice-web-build.zip -d /tmp/alice-web-build

      - name: Replace published files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/alice-web-build/. .
          touch .nojekyll

      - name: Commit deployment and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deploy-reviewed-8to10-20260802.yml
          git add -A
          git commit -m "Deploy 282 reviewed 8-to-10 character terms"
          git push origin HEAD:main
