name: Publish approved pronunciation mode

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pronunciation-20260928.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify and apply approved release bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, json, subprocess, zipfile
          source = '7cfef51d194b4d54c4824f2a5f3cd683671fcfbc'
          manifest = json.loads(Path('publish_bridge/manifest.json').read_text())
          assert manifest['source_commit'] == source
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == manifest['previous_public_commit'], 'Public build has changed'
          chunks = sorted(Path('publish_bridge/chunks').glob('part_*.b64'))
          assert [p.name for p in chunks] == [f'part_{i:04d}.b64' for i in range(manifest['chunk_count'])]
          archive = base64.b64decode(''.join(p.read_text() for p in chunks), validate=True)
          assert len(archive) == manifest['archive_bytes']
          assert hashlib.sha256(archive).hexdigest() == manifest['archive_sha256']
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert sorted(z.namelist()) == sorted(manifest['changed_files'])
              for name in z.namelist():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in ('.git', '.github', 'publish_bridge')
                  data = z.read(name)
                  assert hashlib.sha256(data).hexdigest() == manifest['file_sha256'][name], name
              z.extractall('.')
          for name, expected in manifest['file_sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          main = Path('main.dart.js').read_text()
          for marker in ('alice_pronunciation_adoption_progress_v1', 'adoption-pronunciation-mode', 'reading_c711d292f7aaaffb', 'opt_b31ec6741768ac16'):
              assert marker in main, marker
          expected = {name: manifest['file_sha256'][name] for name in ['index.html', 'flutter_bootstrap.js', 'main.dart.js', 'flutter_service_worker.js', 'alice-release.json', 'assets/fonts/MaterialIcons-Regular.otf']}
          Path('/tmp/alice-published-hashes.json').write_text(json.dumps(expected))
          print('VERIFIED SOURCE', source)
          print('VERIFIED FILES', len(manifest['file_sha256']))
          print('UPDATED FILES', manifest['changed_files'])
          PY
      - name: Publish to existing Alice URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          shutil.rmtree('publish_bridge')
          Path('.github/workflows/publish-pronunciation-20260928.yml').unlink()
          PY
          git config user.name 'alice-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish pronunciation adoption mode from 7cfef51d'
          git push origin main
      - name: Verify served release
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          base = 'https://ht8hcrmswh-hue.github.io/english_word_app/'
          expected = json.loads(Path('/tmp/alice-published-hashes.json').read_text())
          for attempt in range(48):
              try:
                  for name, digest in expected.items():
                      req = urllib.request.Request(base + name + '?v=7cfef51d', headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=25) as response:
                          actual = hashlib.sha256(response.read()).hexdigest()
                      if actual != digest:
                          raise ValueError(name + ' is waiting for Pages propagation')
                  print('PAGES VERIFIED source 7cfef51d194b4d54c4824f2a5f3cd683671fcfbc')
                  print('URL', base + '?v=7cfef51d')
                  break
              except Exception as error:
                  if attempt == 47:
                      raise
                  print('Waiting for Pages:', error, flush=True)
                  time.sleep(5)
          PY
