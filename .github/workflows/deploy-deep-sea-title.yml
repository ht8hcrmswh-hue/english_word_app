name: Deploy Deep Sea title preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-deep-sea-title.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download verified build
        env:
          ARTIFACT_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-416c-8230-b2e1-ed1026a4fa4a/raw?se=2026-09-21T09%3A27%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=87eaaf69-0252-5a01-bb25-386deda348cd&skoid=03727f49-62d3-42ac-8350-1c0e6559d238&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T00%3A54%3A01Z&ske=2026-09-22T00%3A54%3A01Z&sks=b&skv=2026-02-06&sig=h91X5Rn0grUZwi3gNrOmHH3rQNxqv6usLDEHIPhocwA%3D"
        run: |
          curl --fail --location "$ARTIFACT_URL" -o /tmp/alice.zip
          rm -rf /tmp/alice-build && mkdir -p /tmp/alice-build
          unzip -q /tmp/alice.zip -d /tmp/alice-build
      - name: Replace Pages build and cache bust
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/alice-build/. .
          python3 - <<'PY'
          from pathlib import Path
          version="de43e5d3"
          p=Path("index.html"); s=p.read_text(); s=s.replace('src="flutter_bootstrap.js"',f'src="flutter_bootstrap.js?v={version}"'); p.write_text(s)
          p=Path("flutter_bootstrap.js"); s=p.read_text(); s=s.replace('"mainJsPath":"main.dart.js"',f'"mainJsPath":"main.dart.js?v={version}"'); p.write_text(s)
          PY
      - name: Publish
        run: |
          git config user.name "alice-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Deep Sea title preview de43e5d3" || exit 0
          git push origin main
